name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 ships the Android SDK preinstalled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make sure the Android SDK is available
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools" && mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager || true)"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
            "$SDKM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          fi

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Lyrics-Status-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Read app version
        id: version
        run: |
          V=$(grep -oP "versionName '\\K[^']+" app/build.gradle)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          # Release text comes from release-notes/<version>.md when it exists
          if [ -f "release-notes/$V.md" ]; then N="release-notes/$V.md"; else N="release-notes/default.md"; fi
          echo "notes=$N" >> "$GITHUB_OUTPUT"

      # If this version's release already exists, remove APKs left by earlier builds (e.g. an old file name)
      - name: Remove stale APKs from the release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}"
          NEW="$(basename app/build/outputs/apk/release/*.apk)"
          for a in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null); do
            if [ "$a" != "$NEW" ]; then gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" -y; fi
          done

      # Every push to main (or a v* tag) publishes the APK as a GitHub pre-release named after versionName.
      # The tag is created by GitHub, so nothing has to be tagged by hand.
      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: Android Lyrics Status ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body_path: ${{ steps.version.outputs.notes }}
          files: app/build/outputs/apk/release/*.apk
