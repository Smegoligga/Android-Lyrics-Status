name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LyricsStatus-Poweramp-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Read app version
        id: version
        run: echo "name=$(grep -oP "versionName '\\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      # Every push to main (or a v* tag) publishes the APK as a GitHub Release.
      # The tag is created by GitHub, so nothing has to be tagged by hand.
      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: LyricsStatus for Poweramp ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download the APK below and install it on your phone. Setup steps are in the README.
          files: app/build/outputs/apk/release/*.apk
